name: Metrics

on:
  # Aggiornamento giornaliero a mezzanotte (UTC)
  schedule: [{cron: "0 0 * * *"}]
  # Esecuzione manuale dalla tab "Actions"
  workflow_dispatch:
  # Rigenera le metriche a ogni push su master
  push: {branches: ["master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Panoramica generale: header, attività, repository + linguaggi e calendario isometrico
      #
      # I repo privati sono inclusi automaticamente perché il token ha lo scope `repo`.
      # I nomi dei repo NON vengono mai stampati da queste sezioni: mostrano solo
      # conteggi aggregati. Attenzione se in futuro aggiungi plugin_activity,
      # plugin_code, plugin_notable, plugin_topics, plugin_stars o plugin_traffic:
      # quelli elencano i repo per nome.
      - name: Overview
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Herbrant
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Rome
          # Solo i repo di cui sei owner. Aggiungi `organization_member` (e lo scope
          # read:org al token) per includere anche i privati delle organizzazioni.
          repositories_affiliations: owner
          # Batch ridotto: a 100 la query GraphQL va in timeout e base/index.mjs la
          # ingoia silenziosamente, lasciando la lista dei repository vuota (stelle,
          # fork, watcher, release e linguaggi tutti a zero).
          repositories_batch: 20
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, tex, jupyter notebook
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          # `base` = solo totale righe aggiunte/rimosse, mostrato nella sezione
          # base.repositories. NON usare `repositories`: elencherebbe i repo per
          # nome, inclusi i privati.
          plugin_lines_sections: base

